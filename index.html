<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noughts and crosses</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gameboard" id="myGameboard">
        <div class="grid-item" data-index="0" data-state="clickable">1</div>

        <div class="grid-item" data-index="2" data-state="clickable">3</div>

        <div class="grid-item" data-index="4" data-state="clickable">5</div>
        <div class="grid-item" data-index="5" data-state="clickable">6</div>
        <div class="grid-item" data-index="6" data-state="clickable">7</div>
        <div class="grid-item" data-index="7" data-state="clickable">8</div>
        <div class="grid-item" data-index="8" data-state="clickable">9</div>
    </div>

</html>
