<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noughts and crosses</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gameboard" id="myGameboard">
        <div class="grid-item" data-index="0" data-state="clickable"></div>
        <div class="grid-item" data-index="1" data-state="clickable"></div>
        <div class="grid-item" data-index="2" data-state="clickable"></div>
        <div class="grid-item" data-index="3" data-state="clickable"></div>
        <div class="grid-item" data-index="4" data-state="clickable"></div>
        <div class="grid-item" data-index="5" data-state="clickable"></div>
        <div class="grid-item" data-index="6" data-state="clickable"></div>
        <div class="grid-item" data-index="7" data-state="clickable"></div>
        <div class="grid-item" data-index="8" data-state="clickable"></div>
    </div>
    <br>

    <div class="purple-form">
        <!-- Field 1 -->
        <div class="input-group">
            <label for="x-player">X-Player</label>
                    <input type="text" id="x-player" name="x-player" value='X' placeholder="Enter name for X player">

            <label for="o-player">O-player</label>
                <input type="text" id="o-player" name="o-player" value='O' placeholder="Enter name for O player">
        </div>

        <!-- The Pretty Purple Button -->
        <button class="button" id="newGameButton">New Game</button>
        
        <h1 id="game-status""></h1>
</div>


    
    
</body>
</html>
